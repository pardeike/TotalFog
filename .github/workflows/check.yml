name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tracked DLL, build and pure tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check tracked gameplay DLL before rebuilding
        run: python scripts/mod verify-binary
      - name: Check formatting, run pure tests and build gameplay and companion
        env:
          TotalFogBuildOutput: ${{ github.workspace }}/artifacts/ci/Assemblies/
        run: python scripts/mod build
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: check-logs-${{ matrix.os }}
          path: artifacts/logs/*.log
          if-no-files-found: ignore
